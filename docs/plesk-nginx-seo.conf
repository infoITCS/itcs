# ITCS — Plesk / nginx SEO routing (Plesk-safe: NO duplicate location /)
#
# Plesk already defines `location /` in the generated vhost. Never add another
# `location /` in "Additional nginx directives"; nginx rejects it with:
#   duplicate location "/"
#
# REQUIRED PLESK SETTINGS
#   1. Plesk > Domains > itcs.com.pk > Apache & nginx Settings.
#   2. Disable "Serve static files by nginx" so requests reach Apache/Passenger.
#   3. Copy docs/plesk-apache-config.htaccess to the domain root as .htaccess.
#      It proxies non-file URLs to the Node app (127.0.0.1:3000).
#   4. Paste this file into "Additional nginx directives" and reload nginx.
#   5. Change port 3000 below if the Node app listens elsewhere.
#
# VERIFY
#   curl -I https://www.itcs.com.pk/                  -> 200
#   curl -I https://www.itcs.com.pk/no-such-page-xyz  -> 404 + noindex header
#   curl -I https://www.itcs.com.pk/blog/3184214      -> 410 Gone
#   curl -I https://www.itcs.com.pk/sitemap.xml       -> 200 application/xml
# ----------------------------------------------------------------------------

# Fresh DB-driven sitemap instead of the build-time file.
location = /sitemap.xml {
  proxy_pass http://127.0.0.1:3000/sitemap.xml;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Hashed Vite assets can be cached forever.
location ~* ^/assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# Missing media must reach Node, which returns 404 + X-Robots-Tag: noindex.
location ~* \.(?:webp|jpg|jpeg|png|svg|woff2?|ico)$ {
  try_files $uri @itcs_node;
}

location @itcs_node {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_intercept_errors off;
}
