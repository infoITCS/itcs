# ITCS — Plesk-safe nginx directives (no duplicate location /)
# Plesk already defines `location /`. This regex location has higher priority
# than that prefix location, so unknown page URLs reach Node instead of the
# static index.html SPA shell. Root, API, assets, uploads and real files are
# excluded from the regex and keep their normal Plesk handling.
#
# Paste into Plesk > Domains > itcs.com.pk > Apache & nginx Settings >
# "Additional nginx directives". Change port 3000 if Node listens elsewhere.
# ----------------------------------------------------------------------------

location ~ ^/(?!$|api/|assets/|uploads/|.*\.[a-zA-Z0-9]+$).*$ {
  try_files $uri @itcs_node;
}

location = /sitemap.xml {
  proxy_pass http://127.0.0.1:3000/sitemap.xml;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location @itcs_node {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_intercept_errors off;
}
