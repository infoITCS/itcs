# ITCS — Plesk-safe nginx directives
# Clear the entire "Additional nginx directives" field before pasting this.
# Plesk already defines location /, so do NOT add another one here.
# In Plesk: disable "Serve static files by nginx" and deploy
# docs/plesk-apache-config.htaccess to the domain root as .htaccess.
# Change port 3000 if the Node app listens elsewhere.

location = /sitemap.xml {
  proxy_pass http://127.0.0.1:3000/sitemap.xml;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~* \.(?:webp|jpg|jpeg|png|svg|woff2?|ico)$ {
  try_files $uri @itcs_node;
}

location @itcs_node {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_intercept_errors off;
}
