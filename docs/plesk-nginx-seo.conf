# ITCS — Plesk / nginx SEO routing (required for correct 404 status codes)
#
# WHY THIS IS NEEDED
#   The live site is served by nginx as static files. Every unknown URL is
#   currently answered with the built index.html and 200 OK, which is exactly
#   what Google Search Console reports as "Soft 404". The Express app already
#   checks the database and returns 200 / 404 / 410, but nginx never sends the
#   request to it for page URLs.
#
# HOW TO APPLY (Plesk)
#   Plesk > Domains > itcs.com.pk > Apache & nginx Settings >
#   "Additional nginx directives" — paste the block below, then save/reload.
#   If your Node app listens on a different port, change 3000 below.
#
#   Alternative: add this to the domain's nginx vhost include file, inside the
#   `server { ... }` block, and reload nginx.
#
# VERIFY
#   curl -I https://www.itcs.com.pk/                          -> 200
#   curl -I https://www.itcs.com.pk/how-to-perform-a-health-check-on-a-cisco-isr-4300-series-router -> 200
#   curl -I https://www.itcs.com.pk/no-such-page-xyz          -> 404 + X-Robots-Tag: noindex, nofollow
#   curl -I https://www.itcs.com.pk/tag/no-such-tag-xyz       -> 404
#   curl -I https://www.itcs.com.pk/uploads/missing.webp      -> 404
#   curl -I https://www.itcs.com.pk/sitemap.xml               -> 200 application/xml
# ----------------------------------------------------------------------------

# Static files are served directly; everything else goes to the Node app so
# Express can decide 200 vs 404 vs 410 from the database.
location / {
  try_files $uri @itcs_node;
}

location @itcs_node {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_intercept_errors off;
}

# Always use the fresh database-driven sitemap instead of the build-time file.
location = /sitemap.xml {
  proxy_pass http://127.0.0.1:3000/sitemap.xml;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Hashed Vite assets can be cached forever; HTML/robots/sitemap must stay fresh.
location ~* ^/assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

location ~* \.(?:webp|jpg|jpeg|png|svg|woff2?|ico)$ {
  try_files $uri @itcs_node;
}
